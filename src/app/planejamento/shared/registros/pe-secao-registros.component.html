<section class="bg-white rounded-lg shadow p-6" [attr.aria-labelledby]="dados && !semTitulo ? idTitulo : null">
  <p *ngIf="carregando && !dados" role="status" class="text-sm text-gray-600">Carregando a seção...</p>

  <div *ngIf="erro" role="alert" class="text-sm text-red-700">
    {{ erro }}
    <button type="button" (click)="carregar()" class="font-semibold underline">Tentar de novo</button>
  </div>

  <ng-container *ngIf="dados as d">
    <div class="flex flex-col md:flex-row md:justify-between gap-3 mb-4">
      <div *ngIf="!semTitulo" class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <h2 [id]="idTitulo" tabindex="-1" class="text-base font-semibold text-gray-900">{{ d.Secao.Titulo }}</h2>
          <span *ngIf="situacao" class="inline-flex items-center px-2 py-0.5 rounded-full border text-xs font-semibold whitespace-nowrap"
                [ngClass]="situacao === 'obrigatorio' ? 'bg-blue-50 text-blue-800 border-blue-200' : 'bg-gray-50 text-gray-600 border-gray-200'">
            {{ situacao === 'obrigatorio' ? 'Seção obrigatória' : 'Seção opcional' }}
          </span>
        </div>
        <p *ngIf="d.Secao.Ajuda" class="text-sm text-gray-600 leading-relaxed mt-0.5">{{ d.Secao.Ajuda }}</p>
      </div>
      <div *ngIf="planilha" class="flex flex-wrap items-start gap-2 shrink-0">
        <button type="button" (click)="baixarPlanilha('xlsx')" [attr.aria-disabled]="baixando !== null || null"
                [attr.aria-label]="'Baixar a planilha de ' + d.Secao.Titulo + ' em XLSX'"
                class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md border border-gray-300 bg-white text-sm text-gray-700 hover:bg-gray-50 disabled:opacity-50 whitespace-nowrap">
          <span class="material-icons text-base" aria-hidden="true">table_view</span> {{ baixando === 'xlsx' ? 'Gerando...' : 'Planilha XLSX' }}
        </button>
        <button type="button" (click)="baixarPlanilha('csv')" [attr.aria-disabled]="baixando !== null || null"
                [attr.aria-label]="'Baixar a planilha de ' + d.Secao.Titulo + ' em CSV'"
                class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md border border-gray-300 bg-white text-sm text-gray-700 hover:bg-gray-50 disabled:opacity-50 whitespace-nowrap">
          <span class="material-icons text-base" aria-hidden="true">download</span> {{ baixando === 'csv' ? 'Gerando...' : 'CSV' }}
        </button>
      </div>
    </div>

    <p *ngIf="!d.PodeEditar && !semAvisoLeitura" class="mb-4 text-xs text-gray-500 italic">
      {{ avisoLeitura || 'Você pode consultar e baixar a planilha. Quem cadastra é o administrador do módulo.' }}
    </p>

    <!-- O que a tela oferece com a tabela vazia (a sugestão do cronograma pelos fluxos) -->
    <ng-container *ngIf="mostraAcaoVazia">
      <ng-container *ngTemplateOutlet="acaoVazia"></ng-container>
    </ng-container>

    <app-pe-formulario-secao *ngIf="d.Secao.Tipo === 'formulario'" [dados]="d" [fonte]="fonte" [prefixoId]="prefixoId"
                             (salvou)="aoMudar($event)" (alterado)="alterado.emit($event)" (recarregar)="carregar()"></app-pe-formulario-secao>
    <app-pe-tabela-registros *ngIf="d.Secao.Tipo === 'tabela'" [dados]="d" [fonte]="fonte" [prefixoId]="prefixoId"
                             [rotuloItem]="rotuloItem" (mudou)="aoMudar($event)" (alterado)="alterado.emit($event)"></app-pe-tabela-registros>
  </ng-container>
</section>
