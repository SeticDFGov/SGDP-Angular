<fieldset [id]="idBase" tabindex="-1" [attr.aria-describedby]="descritores">
  <legend class="block text-sm font-semibold text-gray-800">
    {{ campo.Rotulo }}<ng-container *ngIf="campo.Obrigatorio"><span class="text-red-600" aria-hidden="true"> *</span><span class="sr-only"> (obrigatório)</span></ng-container>
  </legend>
  <div [id]="idBase + '-ajuda'" class="mt-0.5">
    <p *ngIf="ajuda" class="text-xs text-gray-600 leading-relaxed">{{ ajuda }}</p>
    <p class="text-xs text-gray-500 italic">{{ dica }}</p>
  </div>

  <!-- O que já está escolhido -->
  <div class="mt-2">
    <p *ngIf="escolhidos.length === 0" class="text-xs text-gray-600">Nenhum item escolhido.</p>
    <ul *ngIf="escolhidos.length > 0" class="flex flex-wrap gap-2" [attr.aria-label]="'Escolhidos em ' + campo.Rotulo">
      <li *ngFor="let v of escolhidos; trackBy: porRegistro"
          class="inline-flex items-center gap-1 rounded-full border border-purple-200 bg-purple-50 pl-2 pr-1 py-0.5 text-xs text-purple-800">
        <span><strong>{{ v.Codigo || 'Item' }}</strong><ng-container *ngIf="resumo(v) as r"> · {{ r }}</ng-container></span>
        <button type="button" (click)="tirar(v)" [attr.aria-label]="'Tirar ' + nomeDoEscolhido(v)" title="Tirar"
                class="p-0.5 rounded-full hover:bg-purple-200">
          <span class="material-icons text-sm" aria-hidden="true">close</span>
        </button>
      </li>
    </ul>
  </div>

  <!-- O que pode ser escolhido -->
  <p *ngIf="indisponivel" class="mt-2 text-xs text-gray-600">{{ indisponivel }}</p>
  <div *ngIf="!indisponivel" class="mt-3">
    <p *ngIf="carregando" role="status" class="text-xs text-gray-600">Carregando as opções...</p>
    <p *ngIf="falhou" role="alert" class="text-xs text-red-700">
      Não foi possível carregar as opções.
      <button type="button" (click)="recarregar()" class="font-semibold underline">Tentar de novo</button>
    </p>
    <ng-container *ngIf="!carregando && !falhou">
      <p *ngIf="opcoes.length === 0" class="text-xs text-gray-600">{{ semOpcoes }}</p>
      <ng-container *ngIf="opcoes.length > 0">
        <div *ngIf="comBusca" class="mb-2">
          <label [for]="idBase + '-busca'" class="block text-xs font-semibold text-gray-700 mb-0.5">Buscar em "{{ alvo }}"</label>
          <!-- Enter na busca não envia o formulário do registro -->
          <input [id]="idBase + '-busca'" type="search" [(ngModel)]="busca" (keydown.enter)="$event.preventDefault()"
                 [attr.aria-controls]="idBase + '-opcoes'" placeholder="Código ou parte do texto"
                 class="w-full md:w-72 px-2 py-1.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <ul [id]="idBase + '-opcoes'" class="max-h-64 overflow-y-auto border border-gray-200 rounded-md divide-y divide-gray-100">
          <li *ngFor="let o of filtradas; trackBy: porId" class="px-3 py-2">
            <label class="flex items-start gap-2 text-sm text-gray-800 cursor-pointer">
              <input *ngIf="multipla" type="checkbox" class="w-4 h-4 mt-0.5 shrink-0" [checked]="escolhido(o)"
                     (change)="alternar(o, $any($event.target).checked)" />
              <input *ngIf="!multipla" type="radio" class="w-4 h-4 mt-0.5 shrink-0" [name]="idBase + '-opcao'" [checked]="escolhido(o)"
                     (change)="escolherUnico(o)" />
              <span class="min-w-0 break-words"><strong *ngIf="o.Codigo">{{ o.Codigo }}</strong><ng-container *ngIf="o.Codigo && o.Rotulo"> · </ng-container>{{ o.Rotulo }}</span>
            </label>
          </li>
        </ul>
        <p class="text-xs text-gray-600 mt-1" aria-live="polite">{{ contagem }}</p>
      </ng-container>
    </ng-container>
  </div>
</fieldset>
<p *ngIf="erro" [id]="idBase + '-erro'" class="text-xs text-red-600 mt-1">{{ erro }}</p>
