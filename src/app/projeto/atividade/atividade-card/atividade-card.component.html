<div class="card">
  <div class="flex items-start gap-2 mb-1">
    <span *ngIf="codigo" class="inline-block bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-mono text-xs font-bold flex-shrink-0">
      {{ codigo }}
    </span>
    <h3 class="text-sm font-semibold text-gray-800">{{ titulo }}</h3>
  </div>
  <p *ngIf="categoria" class="text-xs text-gray-500 mb-2">{{ categoria }}</p>
  <p *ngIf="descricao" class="text-xs text-gray-600">{{ descricao }}</p>
  <div class="actions">
    <button (click)="editAtividade()">✏️ Editar</button>
    <button (click)="deleteAtividade()">🗑️ Excluir</button>
  </div>
</div>
