<div *ngIf="isOpen" class="fixed inset-0 z-[999] bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg transform transition-all animate-fade-in-up">

    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-xl">
      <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
        <span class="material-icons text-blue-600">edit_note</span>
        {{ atividade ? 'Editar Atividade' : 'Nova Atividade' }}
      </h2>
      <button
        type="button"
        (click)="handleClose()"
        class="text-gray-400 hover:text-red-500 transition-colors rounded-full p-1 hover:bg-red-50"
      >
        <span class="material-icons text-xl">close</span>
      </button>
    </div>

    <form (ngSubmit)="handleSave()" class="p-6 space-y-5">

      <div>
        <label for="titulo" class="block text-xs font-bold text-gray-500 uppercase mb-1">Título da Atividade</label>
        <input
          type="text"
          id="titulo"
          name="titulo"
          [(ngModel)]="atividadeForm.titulo"
          required
          placeholder="Ex: Reunião de Alinhamento"
          class="w-full px-4 py-2.5 text-sm text-gray-700 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <div>
          <label for="categoria" class="block text-xs font-bold text-gray-500 uppercase mb-1">Categoria</label>
          <select
            id="categoria"
            name="categoria"
            [(ngModel)]="atividadeForm.categoria"
            required
            class="w-full px-4 py-2.5 text-sm text-gray-700 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
          >
            <option value="" disabled selected>Selecione</option>
            <option value="pessoas">Pessoas</option>
            <option value="processos">Processos</option>
            <option value="tecnologias">Tecnologias</option>
          </select>
        </div>

        <div>
          <label for="situacao" class="block text-xs font-bold text-gray-500 uppercase mb-1">Situação</label>
          <select
            id="situacao"
            name="situacao"
            [(ngModel)]="atividadeForm.situacao"
            class="w-full px-4 py-2.5 text-sm text-gray-700 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
          >
            <option [ngValue]="4">A fazer</option>
            <option [ngValue]="2">Próximo</option>
            <option [ngValue]="1">Em Andamento</option>
            <option [ngValue]="3">Concluído</option>
          </select>
        </div>
      </div>

      <div>
        <label for="data_fim" class="block text-xs font-bold text-gray-500 uppercase mb-1">Prazo Final</label>
        <input
          type="date"
          id="data_fim"
          name="data_fim"
          [(ngModel)]="atividadeForm.data_fim"
          class="w-full px-4 py-2.5 text-sm text-gray-700 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        />
      </div>

      <div>
        <label for="descricao" class="block text-xs font-bold text-gray-500 uppercase mb-1">Descrição Detalhada</label>
        <textarea
          id="descricao"
          name="descricao"
          [(ngModel)]="atividadeForm.descricao"
          required
          rows="3"
          placeholder="Descreva os detalhes da atividade..."
          class="w-full px-4 py-2.5 text-sm text-gray-700 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"
        ></textarea>
      </div>

      <div class="pt-4 border-t border-gray-100 flex justify-end space-x-3">
        <button
          type="button"
          (click)="handleClose()"
          class="px-5 py-2.5 rounded-lg text-sm font-bold text-gray-600 border border-gray-300 hover:bg-gray-50 hover:text-gray-800 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-5 py-2.5 rounded-lg text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md hover:shadow-lg transition-all transform active:scale-95"
        >
          Salvar Dados
        </button>
      </div>

    </form>
  </div>
</div>
