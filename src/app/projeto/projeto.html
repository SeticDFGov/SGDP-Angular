<div class="flex justify-between items-center mb-4">
  <app-projeto-form
  *ngIf="isModalOpen"
  (close)="fecharModal()"
  [esteiras]="listaEsteiras"
  [unidades]="listaUnidades"
  [demandantes]="listaDemandantes"
  (formSubmit)="salvarProjetos($event)"
  ></app-projeto-form>
  <p class="text-gray-600">
    {{ projetos.length }} Resultados encontrados
  </p>
  <div class="flex space-x-2">
    <button (click)="abrirModal()" class="border roun  ded-lg py-2 px-4 flex items-center rounded-xl bg-gray-800 text-white">
      <span class="material-icons mr-2">add</span>
      Adicionar Projeto
    </button>
  </div>
</div>

<div class="overflow-x-auto bg-white rounded-lg shadow">
  <table *ngIf="projetos.length > 0; else semProjetos" class="w-full border-collapse">
    <thead>
      <tr class="bg-gray-100 border-b">
        <th class="text-left text-gray-600 p-3">Nome do projeto</th>
        <th class="text-left text-gray-600 p-3">Gerente</th>
        <th class="text-left text-gray-600 p-3">Processo SEI</th>
        <th class="text-left text-gray-600 p-3">Área Demandante</th>
        <th class="text-left text-gray-600 p-3">Ano</th>
        <th class="p-3 text-left text-gray-600">Ação</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let projeto of projetos" class="border-b hover:bg-gray-50">
        <td class="p-3">{{ projeto.NM_PROJETO }}</td>
        <td class="p-3">{{ projeto.GERENTE_PROJETO }}</td>
        <td class="p-3">{{ projeto.NR_PROCESSO_SEI }}</td>
        <td class="p-3">{{ projeto.AREA_DEMANDANTE?.NM_SIGLA }}</td>
        <td class="p-3">{{ projeto.ANO }}</td>
        <td class="p-3">
          <button class="button is-primary" [routerLink]="['/projetos', projeto.projetoId, 'etapas']">
            <span class="material-icons">chevron_right</span>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #semProjetos>
  <div class="text-center p-8 border rounded-lg bg-gray-50">
    <p class="text-gray-500">Nenhum projeto encontrado.</p>
  </div>
</ng-template>
