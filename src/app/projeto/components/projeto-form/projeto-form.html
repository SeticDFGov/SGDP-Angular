<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">

  <div class="bg-white p-8 rounded-lg shadow-xl w-[700px] h-[90vh] overflow-y-auto flex flex-col">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Cadastro de Projeto</h2>

    <div *ngIf="message" class="text-red-500 mb-4 text-center">{{ message }}</div>

    <form [formGroup]="projetoForm" (ngSubmit)="onSubmit()" class="flex flex-col flex-grow space-y-5 text-gray-700">

      <div>
        <label class="block text-sm font-medium mb-1">Nome do Projeto</label>
        <input
          type="text"
          formControlName="NM_PROJETO"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
          required
        />
        </div>

      <div>
        <label class="block text-sm font-medium mb-1">Gerente do Projeto</label>
        <input
          type="text"
          formControlName="GERENTE_PROJETO"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
          required
        />
      </div>

    <div>
  <label class="block text-sm font-medium mb-1">Número do Processo SEI</label>
  <input
    type="text"
    formControlName="NR_PROCESSO_SEI"
    placeholder="00000.000000/0000-00"
    maxlength="20"
    (input)="formatarProcessoSEI($event)"
    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
    [ngClass]="{'border-red-500': projetoForm.get('NR_PROCESSO_SEI')?.invalid && projetoForm.get('NR_PROCESSO_SEI')?.touched}"
  />

  <div *ngIf="projetoForm.get('NR_PROCESSO_SEI')?.errors?.['pattern'] && projetoForm.get('NR_PROCESSO_SEI')?.touched" class="text-red-500 text-xs mt-1">
    Formato inválido. Use: 00000.000000/AAAA-DV
  </div>
</div>
<div class="mb-4">
        <label class="block text-sm font-medium">Data Início Projeto</label>
        <input
          type="date"
          name="DT_INICIO"
          formControlName="DT_INICIO"
          class="w-full p-2 border border-gray-300 rounded-md"
          required
        />
      </div>
<div class="mb-4">
        <label class="block text-sm font-medium">Data Término Projeto</label>
        <input
          type="date"
          name="DT_TERMINO"
          formControlName="DT_TERMINO"
          class="w-full p-2 border border-gray-300 rounded-md"
          required
        />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Ano</label>
        <input
          type="text"
          formControlName="ANO"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Área Demandante</label>
        <select
          formControlName="NM_AREA_DEMANDANTE"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
          required
        >
          <option value="">Selecione uma Área</option>
          <option *ngFor="let d of demandantes" [value]="d.AreaDemandanteID">
            {{ d.NM_DEMANDANTE }}
          </option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Subsecretaria</label>
        <select
          formControlName="UnidadeId"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
          required
        >
          <option value="">Selecione uma Unidade</option>
          <option *ngFor="let u of unidades" [value]="u.id">{{ u.Nome }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Esteira</label>
        <select
          formControlName="EsteiraId"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
          required
        >
          <option value="">Selecione uma Esteira</option>
          <option *ngFor="let e of esteiras" [value]="e.EsteiraId">
            {{ e.Nome.trim() }}
          </option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Template</label>
        <select
          formControlName="TEMPLATE"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
        >
          <option value="">Não se aplica</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Valor Estimado</label>
        <input
          type="number"
          formControlName="valorEstimado"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
          required
        />
      </div>

      <div class="flex flex-col space-y-2">
        <label class="inline-flex items-center space-x-2">
          <input type="checkbox" formControlName="PDTIC2427" />
          <span>PDTIC 24/27</span>
        </label>
        <label class="inline-flex items-center space-x-2">
          <input type="checkbox" formControlName="PROFISCOII" />
          <span>PROFISCO II</span>
        </label>
        <label class="inline-flex items-center space-x-2">
          <input type="checkbox" formControlName="PTD2427" />
          <span>PTD 24/27</span>
        </label>
      </div>

      <div class="w-full flex justify-center gap-4 pt-6 border-t border-gray-200 mt-auto">
        <button
          type="button"
          (click)="onCancel()"
          class="px-6 py-2 rounded-lg border border-gray-400 text-gray-700 hover:bg-gray-100 transition"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-400 transition"
          [disabled]="projetoForm.invalid"
        >
          Cadastrar
        </button>
      </div>
    </form>
  </div>
</div>
