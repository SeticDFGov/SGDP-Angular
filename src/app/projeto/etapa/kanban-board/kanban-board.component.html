<div *ngIf="reportStatus === ReportStatus.VERIFICANDO || loadingAtividades" class="text-center p-4">
  <p>A carregar atividades...</p>
</div>

<div *ngIf="reportStatus === ReportStatus.AUSENTE || reportStatus === ReportStatus.CRIANDO" class="init-report-container p-4 border rounded-lg shadow-md bg-white">
  <h2 class="text-xl font-bold mb-2">Report Não Iniciado</h2>
  <p class="text-gray-700 mb-4">É necessário iniciar um report para este projeto antes de adicionar atividades.</p>
  <form (ngSubmit)="handleCreateReport()" class="init-report-form space-y-4">
    <input
      name="descricao"
      placeholder="Descrição do Report"
      [(ngModel)]="newReportData.descricao"
      (change)="handleNewReportChange($event)"
      required
      class="w-full p-2 border border-gray-300 rounded-md"
    />
    <input
      name="fase"
      placeholder="Fase Inicial"
      [(ngModel)]="newReportData.fase"
      (change)="handleNewReportChange($event)"
      required
      class="w-full p-2 border border-gray-300 rounded-md"
    />
    <button type="submit" [disabled]="reportStatus === ReportStatus.CRIANDO"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 disabled:opacity-50">
      {{ reportStatus === ReportStatus.CRIANDO ? 'A criar...' : 'Iniciar Report' }}
    </button>
  </form>
</div>

<div *ngIf="reportStatus === ReportStatus.EXISTENTE">
  <button (click)="handleOpenModal()" class="add-task-btn bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 mb-4">
    + Adicionar Atividade
  </button>

  <div class="kanban-container" cdkDropListGroup>
    <div *ngFor="let column of columns" class="kanban-column">
      <h2 class="column-title">{{ column.name }}</h2>
      <div
        [id]="column.id"
        cdkDropList
        [cdkDropListData]="column.atividades"
        class="kanban-list"
        (cdkDropListDropped)="drop($event)">
        <app-atividade-card
          *ngFor="let atividade of column.atividades"
          cdkDrag
          [atividade]="atividade"
          (onEdit)="handleOpenModal($event)"
          (onDelete)="handleDelete($event)"
          class="kanban-card"
        ></app-atividade-card>
      </div>
    </div>
  </div>

  <app-atividade-modal
    [isOpen]="isModalOpen"
    [atividade]="editingAtividade"
    (onClose)="handleCloseModal()"
    (onSave)="handleSaveAtividade($event)"
  ></app-atividade-modal>
</div>
