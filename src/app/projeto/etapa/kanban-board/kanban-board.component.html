<div class="kanban-container" cdkDropListGroup>
  <div *ngFor="let column of columns" class="kanban-column">
    <h2 class="column-title">{{ column.name }}</h2>
    <div
      [id]="column.id"
      cdkDropList
      [cdkDropListData]="column.etapas"
      class="kanban-list"
      (cdkDropListDropped)="drop($event)">
      <div *ngFor="let etapa of column.etapas" cdkDrag class="kanban-card">
        <div class="card-header">{{ etapa.nmEtapa }}</div>
        <div class="card-content">
          <p><strong>Início Previsto:</strong> {{ etapa.dtInicioPrevisto | date:'dd/MM/yyyy' }}</p>
          <p><strong>Término Previsto:</strong> {{ etapa.dtTerminoPrevisto | date:'dd/MM/yyyy' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
