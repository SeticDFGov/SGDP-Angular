<div class="flex flex-col h-full">

  <div class="flex justify-between items-center mb-6 px-1">
    <div>
      <h3 class="text-lg font-bold text-gray-700">Fluxo de Trabalho</h3>
      <p class="text-sm text-gray-500">Gerencie o andamento das atividades</p>
    </div>

    <button
      (click)="handleOpenModal()"
      class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-lg shadow-lg hover:shadow-blue-500/30 transition-all duration-200"
    >
      <span class="material-icons text-sm">add</span>
      <span>Nova Atividade</span>
    </button>
  </div>

  <div class="flex-1 overflow-x-auto overflow-y-hidden">
    <div class="flex h-full gap-6 pb-4 min-w-fit" cdkDropListGroup>

      <div
        *ngFor="let column of columns"
        class="flex flex-col w-80 flex-shrink-0 bg-gray-50/80 rounded-2xl border border-gray-200/60 shadow-sm max-h-full"
      >

        <div class="p-4 flex items-center justify-between border-b border-gray-100 sticky top-0 bg-gray-50/80 backdrop-blur-sm z-10 rounded-t-2xl">
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full"
                 [ngClass]="{
                   'bg-slate-300': column.id === 'todo' || column.name.includes('Fazer'),
                   'bg-blue-500': column.id === 'doing' || column.name.includes('Andamento'),
                   'bg-green-500': column.id === 'done' || column.name.includes('Concluído')
                 }">
            </div>
            <h2 class="text-sm font-bold text-gray-600 uppercase tracking-wider">{{ column.name }}</h2>
          </div>

          <span class="px-2.5 py-0.5 rounded-md bg-white border border-gray-200 text-xs font-bold text-gray-500 shadow-sm">
            {{ column.atividades.length }}
          </span>
        </div>

        <div
          [id]="column.id"
          cdkDropList
          [cdkDropListData]="column.atividades"
          class="flex-1 p-3 space-y-3 overflow-y-auto min-h-[150px] custom-scrollbar"
          (cdkDropListDropped)="drop($event)">

          <app-atividade-card
            *ngFor="let atividade of column.atividades"
            cdkDrag
            [atividade]="atividade"
            (onEdit)="handleOpenModal($event)"
            (onDelete)="handleDelete($event)"
            class="block"
          >
            <div *cdkDragPlaceholder class="custom-placeholder"></div>
          </app-atividade-card>

        </div>
      </div>

    </div>
  </div>

  <app-atividade-modal
    [isOpen]="isModalOpen"
    [atividade]="editingAtividade"
    (onClose)="handleCloseModal()"
    (onSave)="handleSaveAtividade($event)"
  ></app-atividade-modal>
</div>
