<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div *ngIf="formData">
  <div class="bg-white p-8 rounded-lg shadow-xl w-[700px] h-auto max-h-[90vh] overflow-y-auto flex flex-col">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Nova Análise de Empenho</h2>

    <form (ngSubmit)="handleSubmit()" class="flex flex-col space-y-5 text-gray-700">
      <div>
        <label class="block text-sm font-medium mb-1">Data Início Real</label>
        <input
          type="date"
          name="DT_INICIO_REAL"
          [(ngModel)]="formData.DT_INICIO_REAL"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
        />
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Data Término Real</label>
        <input
          type="date"
          name="DT_TERMINO_REAL"
          [(ngModel)]="formData.DT_TERMINO_REAL"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
        />
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Percentual Executado da Etapa</label>
        <select
          name="PERCENT_EXEC_ETAPA"
          [(ngModel)]="formData.PERCENT_EXEC_ETAPA"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
          required
        >
          <option [ngValue]="null">Selecione o percentual</option>

    <option [ngValue]="0">0%</option>
    <option [ngValue]="20">20%</option>
    <option [ngValue]="40">40%</option>
    <option [ngValue]="60">60%</option>
    <option [ngValue]="80">80%</option>
    <option [ngValue]="100">100%</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Análise da Etapa</label>
        <textarea
          name="ANALISE"
          [(ngModel)]="formData.ANALISE"
          rows="4"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 resize-y"
          placeholder="Digite a análise aqui..."
        ></textarea>
      </div>

      <div class="w-full flex justify-center gap-4 pt-6 border-t border-gray-200 mt-2">
        <button
          type="button"
          (click)="closeModal()"
          class="px-6 py-2 rounded-lg border border-gray-400 text-gray-700 hover:bg-gray-100 transition"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-400 transition"
        >
          Nova Análise
        </button>
      </div>
    </form>
  </div>
  </div>
</div>
