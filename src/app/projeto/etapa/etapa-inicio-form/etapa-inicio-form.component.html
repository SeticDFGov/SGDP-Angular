<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white p-8 rounded-lg shadow-xl w-[700px] max-h-[90vh] overflow-y-auto flex flex-col">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Iniciar Etapa</h2>

    <form (ngSubmit)="handleSubmit()" class="grid grid-cols-1 gap-5 text-gray-700">
      <div>
        <label class="block text-sm font-medium mb-1">Data Início Previsto</label>
        <input
          type="date"
          name="DT_INICIO_PREVISTO"
          [(ngModel)]="dtInicioPrevisto"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400"
          required
        />
      </div>

      <div class="col-span-1 sm:col-span-2 flex justify-center gap-4 pt-6 border-t border-gray-200 mt-2">
        <button
          type="button"
          (click)="closeModal()"
          class="px-6 py-2 rounded-lg border border-gray-400 text-gray-700 hover:bg-gray-100 transition"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-400 transition"
        >
          Iniciar
        </button>
      </div>
    </form>
  </div>
</div>
