<div *ngIf="isOpen" class="fixed z-50 inset-0 bg-gray-500 bg-opacity-50 flex justify-center items-center">
  <div class="bg-white p-6 rounded-md w-[600px] shadow-lg">
    <h2 class="text-xl font-semibold mb-4">Cadastrar Entregável</h2>
    <form [formGroup]="etapaForm" (ngSubmit)="handleSubmit()" class="space-y-4">
      <div class="mb-4">
        <label class="block text-sm font-medium">Nome do Entregável</label>
        <input
          type="text"
          name="NM_ETAPA"
          formControlName="NM_ETAPA"
          class="w-full p-2 border border-gray-300 rounded-md"
          placeholder="Ex: Levantamento de Requisitos, Documentação Final"
          required
        />
        <p class="text-xs text-gray-500 mt-1">Datas e percentuais serão calculados automaticamente com base nas atividades</p>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium">Responsável pelo Entregável</label>
        <input
          type="text"
          name="RESPONSAVEL_ETAPA"
          formControlName="RESPONSAVEL_ETAPA"
          class="w-full p-2 border border-gray-300 rounded-md"
          placeholder="Nome do responsável"
        />
      </div>

      <div class="flex justify-end space-x-2">
        <button
          type="button"
          (click)="closeModal()"
          class="px-4 py-2 bg-gray-300 rounded-md"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-500 text-white rounded-md"
        >
          Cadastrar
        </button>
      </div>
    </form>
  </div>
</div>
