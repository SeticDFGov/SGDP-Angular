<div class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50" (click)="fechar.emit()">
  <div appDialogo aria-labelledby="ctr-inc-titulo" aria-describedby="ctr-inc-texto" (fechar)="fechar.emit()" (click)="$event.stopPropagation()"
       class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-full overflow-y-auto p-6">
    <div class="flex items-start justify-between gap-4 mb-2">
      <h2 id="ctr-inc-titulo" class="text-base font-semibold text-blue-900">Incorporar o painel em outro site</h2>
      <button type="button" (click)="fechar.emit()" aria-label="Fechar" title="Fechar"
              class="p-1 rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100">
        <span class="material-icons text-xl leading-none" aria-hidden="true">close</span>
      </button>
    </div>
    <p id="ctr-inc-texto" class="text-sm text-gray-600 leading-relaxed mb-4">
      Cole o código no HTML da página do seu site. O painel aparece sem o cabeçalho do SGDP, com os filtros, os
      cartões e a tabela. O script é opcional: ele ajusta a altura do quadro ao painel; sem ele, o quadro fica com
      1.100 px de altura e rola por dentro.
    </p>

    <label *ngIf="temFiltros" class="flex items-start gap-2 text-sm text-gray-700 mb-4">
      <input type="checkbox" class="mt-1" [(ngModel)]="levarFiltros" (ngModelChange)="montar()" name="ctr-inc-filtros">
      <span>Abrir já com os filtros aplicados agora <span class="text-xs text-gray-500 italic">({{ resumoFiltros }})</span></span>
    </label>

    <div class="mb-4">
      <label for="ctr-inc-tema" class="block text-xs font-semibold text-gray-600 mb-1">Tema do painel</label>
      <select id="ctr-inc-tema" name="ctr-inc-tema" [(ngModel)]="tema" (ngModelChange)="montar()"
              class="px-3 py-2 border border-gray-300 rounded-md text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option *ngFor="let t of temas" [ngValue]="t.valor">{{ t.rotulo }}</option>
      </select>
    </div>

    <label for="ctr-inc-codigo" class="block text-xs font-semibold text-gray-600 mb-1">Código para colar no site</label>
    <textarea id="ctr-inc-codigo" readonly rows="11" spellcheck="false" [value]="codigo"
              class="w-full px-3 py-2 border border-gray-300 rounded-md text-xs font-mono bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>

    <div class="flex flex-wrap justify-end gap-2 mt-4">
      <button type="button" (click)="copiarLink()"
              class="inline-flex items-center gap-2 text-sm font-semibold text-blue-700 border border-blue-600 rounded-md px-4 py-2 hover:bg-blue-50">
        <span class="material-icons text-lg leading-none" aria-hidden="true">link</span>Copiar só o link
      </button>
      <button type="button" (click)="copiarCodigo()"
              class="inline-flex items-center gap-2 bg-blue-600 text-white text-sm font-semibold py-2 px-4 rounded-md hover:bg-blue-700">
        <span class="material-icons text-lg leading-none" aria-hidden="true">content_copy</span>Copiar código
      </button>
    </div>
  </div>
</div>
