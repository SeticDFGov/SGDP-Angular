<div>
  <!-- Já tem arquivo: nome, tamanho e o que dá para fazer com ele -->
  <div *ngIf="temAnexo" class="flex items-center gap-3 flex-wrap border border-gray-200 rounded-md bg-white px-3 py-2">
    <span class="material-icons text-base text-gray-500">description</span>
    <span class="text-sm text-gray-800 break-all flex-1">{{ nomeExibido }}
      <span *ngIf="tamanhoExibido" class="text-gray-500">· {{ tamanhoExibido }}</span>
    </span>
    <button type="button" (click)="baixar()" [disabled]="baixando"
            class="text-sm text-blue-700 border border-blue-600 rounded px-3 py-1 hover:bg-blue-50 disabled:opacity-50">
      {{ baixando ? 'Baixando...' : 'Baixar' }}
    </button>
    <label *ngIf="!somenteLeitura && (documentoId || criarDocumento)"
           class="text-sm text-blue-700 border border-blue-600 rounded px-3 py-1 hover:bg-blue-50 cursor-pointer">
      {{ enviando ? 'Enviando...' : 'Trocar arquivo' }}
      <input type="file" class="hidden" [accept]="aceita" [disabled]="enviando" (change)="aoEscolherArquivo($event)">
    </label>
  </div>

  <!-- Sem arquivo -->
  <ng-container *ngIf="!temAnexo">
    <!-- Leitura: nada anexado -->
    <p *ngIf="somenteLeitura" class="text-sm text-gray-500">Nenhum arquivo anexado.</p>

    <ng-container *ngIf="!somenteLeitura">
      <!-- Ainda não há documento: explica o passo que falta -->
      <ng-container *ngIf="!documentoId && !criarDocumento">
        <input type="text" readonly [value]="'anexo indisponível por enquanto'"
               class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm bg-gray-50 text-gray-500">
        <p class="text-xs text-gray-400 italic mt-1">{{ avisoSemDocumento }}</p>
      </ng-container>

      <!-- Pronto para enviar -->
      <ng-container *ngIf="documentoId || criarDocumento">
        <label class="inline-flex items-center gap-2 text-sm font-semibold text-blue-700 border border-blue-600 rounded-md px-3 py-2 hover:bg-blue-50 cursor-pointer"
               [class.opacity-50]="enviando">
          <span class="material-icons text-base">upload_file</span>
          {{ enviando ? 'Enviando...' : 'Escolher arquivo' }}
          <input type="file" class="hidden" [accept]="aceita" [disabled]="enviando" (change)="aoEscolherArquivo($event)">
        </label>
        <p class="text-xs text-gray-400 italic mt-1">Até 25 MB, nos formatos pdf, doc, docx, odt, xls, xlsx, ods, csv, txt, png, jpg ou jpeg.</p>
      </ng-container>
    </ng-container>
  </ng-container>
</div>
