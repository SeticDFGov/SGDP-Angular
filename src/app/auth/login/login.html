<div
  class="min-h-screen bg-cover bg-center flex"
  [ngStyle]="{ 'background-image': 'url(\'/assets/login2.jpg\')' }"
>
  <div class="w-1/3 min-h-screen bg-blue-900 bg-opacity-90 flex flex-col justify-center p-10">
    <h2 class="text-3xl font-bold text-white mb-8 text-center">Bem-Vindo</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <input
        type="text"
        placeholder="E-mail"
        formControlName="Email"
        class="w-full p-3 rounded-lg bg-white text-black placeholder-gray-600"
        required
      />
      <input
        type="password"
        placeholder="Senha"
        formControlName="Senha"
        class="w-full p-3 rounded-lg bg-white text-black placeholder-gray-600"
        required
      />

      <div class="flex items-center justify-between text-sm text-white">
        <label class="flex items-center space-x-2">
          <input type="checkbox" class="form-checkbox text-white" />
          <span>Lembrar senha</span>
        </label>
      </div>

      <button
        type="submit"
        class="w-full bg-green-400 text-white font-semibold py-2 rounded-full hover:bg-green-500 transition"
        [disabled]="loginForm.invalid || carregando"
      >
        {{ carregando ? 'Autenticando...' : 'Entrar' }}
      </button>

      <div *ngIf="mensagem" class="text-sm text-red-100 text-center mt-2">
        {{ mensagem }}
      </div>
    </form>
  </div>


</div>
