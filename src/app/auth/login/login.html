<main id="conteudo" tabindex="-1" class="min-h-screen flex items-center justify-center bg-gray-100 relative overflow-hidden auth-wrapper">
  <div class="absolute inset-0 z-0 auth-bg">
    <span class="r absolute block"></span>
    <span class="r s absolute block"></span>
    <span class="r s absolute block"></span>
    <span class="r absolute block"></span>
  </div>

  <div class="w-full max-w-lg z-10 p-4 auth-content">
    <div class="bg-white rounded-xl shadow-2xl overflow-hidden">
      <div class="p-8 text-center">

        <div class="mb-8 flex justify-center">
           <img src="../assets/MarcaGDF2026_Horizontal_S-Conceito_BRANCO.png" alt="Logo GDF" class="h-24 w-auto object-contain">
        </div>

        <h3 class="mb-6 text-2xl font-bold text-gray-800">Entrar</h3>

        @if (mensagem) {
          <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg animate-fade-in-down">
            <div class="flex">
              <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                </svg>
              </div>
              <div class="ml-3">
                <p class="text-sm text-red-700">
                  {{ mensagem }}
                </p>
              </div>
            </div>
          </div>
        }

        @if (oidcConfigurado) {
          <button
            type="button"
            (click)="entrarComKeycloak()"
            [disabled]="carregando"
            [class.opacity-50]="carregando"
            [class.cursor-not-allowed]="carregando"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-xl transition duration-200 mb-6 flex justify-center items-center">
            @if (carregando) {
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Abrindo a tela de login...
            } @else {
              Entrar
            }
          </button>
        } @else {
          <p class="mb-6 text-sm text-gray-500">O login pelo Keycloak não está configurado neste ambiente.</p>
        }

        @if (modoLocalDisponivel) {
          <p class="text-center text-sm text-gray-500">
            Ambiente de desenvolvimento:
            <a routerLink="/auth/local" class="text-blue-600 underline">entrar no modo local (sem Keycloak)</a>
          </p>
        }

      </div>
    </div>
  </div>
</main>
